<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Roster</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Booking &amp; Comercial · <a href="roster.html" style="color:inherit;">Roster</a></div>
        <h1 id="rst-titulo-cabecera">Espectáculo</h1>
      </div>
      <button class="btn-accent" onclick="guardarRoster()" id="btn-guardar-rst">Guardar cambios</button>
    </div>

    <div class="card">
      <form id="form-roster" onsubmit="return false;">

        <div class="hr-section">
          <div class="form-grid">
            <div class="field field-wide">
              <label for="rst-nombre">Nombre del espectáculo / artista</label>
              <input type="text" id="rst-nombre" required />
            </div>
            <div class="field field-wide">
              <label for="rst-oficina">Oficina de representación (opcional)</label>
              <input type="text" id="rst-oficina" />
            </div>
          </div>
        </div>

        <!-- Cartel -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Cartel / imagen</h3></div>
          <div class="poster-picker" style="display:flex; align-items:center; gap:16px;">
            <div class="poster-preview" id="poster-preview">Sin imagen</div>
            <div class="logo-actions">
              <button type="button" class="btn-ghost" onclick="document.getElementById('poster-input').click()">Subir imagen</button>
              <button type="button" class="btn-ghost" id="btn-quitar-poster" style="display:none;" onclick="quitarPoster()">Quitar</button>
              <input type="file" id="poster-input" accept="image/*" onchange="procesarPoster(event)" style="display:none;" />
            </div>
          </div>
        </div>

        <!-- Contactos -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Contactos</h3></div>
          <div id="lista-contactos-rst"></div>
          <button type="button" class="add-row-link" onclick="anadirContactoRst()">+ Añadir contacto</button>
        </div>

        <!-- Calculadora -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Caché, comisión e IVA</h3></div>
          <div class="form-grid">
            <div class="field"><label for="rst-cache">Caché (BI) €</label><input type="number" id="rst-cache" min="0" step="0.01" oninput="recalcular()" /></div>
            <div class="field">
              <label for="rst-comision-preset">Comisión guardada</label>
              <select id="rst-comision-preset" onchange="aplicarComisionPreset()">
                <option value="">— Manual —</option>
              </select>
            </div>
            <div class="field"><label for="rst-comision-pct">Comisión (%)</label><input type="number" id="rst-comision-pct" min="0" max="100" step="0.1" oninput="recalcular()" /></div>
            <div class="field"><label for="rst-iva-pct">IVA (%)</label><input type="number" id="rst-iva-pct" min="0" max="100" step="0.1" value="21" oninput="recalcular()" /></div>
          </div>

          <div class="calc-box" style="margin-top:16px;">
            <div class="calc-item"><div class="calc-label">Caché (BI)</div><div class="calc-value" id="calc-cache">0,00 €</div></div>
            <div class="calc-item"><div class="calc-label">Comisión</div><div class="calc-value" id="calc-comision">0,00 €</div></div>
            <div class="calc-item"><div class="calc-label">Total</div><div class="calc-value" id="calc-total">0,00 €</div></div>
            <div class="calc-item calc-total"><div class="calc-label">Total + IVA</div><div class="calc-value" id="calc-total-iva">0,00 €</div></div>
          </div>
        </div>

        <!-- Redes sociales -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Redes sociales</h3></div>
          <div id="lista-redes"></div>
          <button type="button" class="add-row-link" onclick="anadirRed()">+ Añadir red social</button>
        </div>

        <!-- Rider técnico -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Rider técnico (PDF)</h3></div>
          <div class="pdf-picker">
            <button type="button" class="btn-ghost" onclick="document.getElementById('rider-input').click()">Subir PDF</button>
            <input type="file" id="rider-input" accept="application/pdf" onchange="procesarRiderPdf(event)" style="display:none;" />
            <div id="rider-chip"></div>
          </div>
          <p style="font-size:12px; color:var(--color-text-muted); margin-top:8px;">Máximo recomendado ~600 KB (se guarda directamente en la base de datos).</p>
        </div>

        <!-- Notas -->
        <div class="hr-section">
          <div class="field">
            <label for="rst-notas">Notas (opcional)</label>
            <input type="text" id="rst-notas" />
          </div>
        </div>

      </form>
    </div>
  </main>

</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/roster-detalle.js"></script>
</body>
</html>
