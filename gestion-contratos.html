<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Gestión Contratos</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Administración</div>
        <h1>Gestión Contratos</h1>
      </div>
      <button class="btn-accent" onclick="guardarClausulas()" id="btn-guardar-gc">Guardar cambios</button>
    </div>

    <div class="card">
      <div class="rst-tabs" id="gc-tabs">
        <button type="button" data-tab="booking" onclick="cambiarTabGC('booking')">Contratos Booking</button>
        <button type="button" data-tab="colaboracion" onclick="cambiarTabGC('colaboracion')">Contratos Colaboración</button>
      </div>

      <div class="rst-tab-panel active" id="gc-panel-booking">
        <p style="font-size:12.5px; color:var(--color-text-muted); margin-bottom:14px;">Cláusulas y condiciones estándar que se incluyen al generar un contrato de booking (desde la ficha de cada Booking → pestaña Contratos).</p>
        <div id="lista-clausulas-booking"></div>
        <button type="button" class="add-row-link" onclick="anadirClausula('booking')">+ Añadir cláusula</button>
      </div>

      <div class="rst-tab-panel" id="gc-panel-colaboracion">
        <p style="font-size:12.5px; color:var(--color-text-muted); margin-bottom:14px;">Cláusulas estándar para contratos de colaboración con artistas (Roster → Jurídico).</p>
        <div id="lista-clausulas-colaboracion"></div>
        <button type="button" class="add-row-link" onclick="anadirClausula('colaboracion')">+ Añadir cláusula</button>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/gestion-contratos.js"></script>
</body>
</html>
