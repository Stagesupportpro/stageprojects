<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Propuesta</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  body { background: var(--color-bg-soft); }
</style>
</head>
<body>

<div class="pv-staff-toolbar">
  <a href="ver-propuestas.html" class="btn-ghost" style="text-decoration:none;">← Volver al listado</a>
  <div style="display:flex; gap:10px;">
    <button class="btn-ghost" onclick="exportarPdfPropuesta()" id="btn-pdf-propuesta">📄 Exportar PDF</button>
    <button class="btn-accent" onclick="enviarAEvaluarPropuesta()" id="btn-evaluar-propuesta">📤 Enviar a evaluar</button>
  </div>
</div>

<div class="propuesta-view" id="pv-content">
  <div class="pv-header">
    <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    <h1 id="pv-nombre">Propuesta</h1>
    <p id="pv-subtitulo">—</p>
  </div>

  <div id="pv-items"></div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/propuesta-ver.js"></script>
</body>
</html>
