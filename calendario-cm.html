<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Calendario CM</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Marketing</div>
        <h1>Calendario CM</h1>
      </div>
      <a href="campanas.html" class="btn-ghost" style="text-decoration:none;">Ver todas las campañas</a>
    </div>

    <h3 style="font-size:14px; font-family:var(--font-display); margin-bottom:12px;">Herramientas rápidas</h3>
    <div class="herramientas-cm-grid">
      <a class="herramienta-cm-card" href="https://business.facebook.com/" target="_blank" rel="noopener"><span class="herramienta-icono">📘</span>Meta Business Suite</a>
      <a class="herramienta-cm-card" href="https://adsmanager.facebook.com/" target="_blank" rel="noopener"><span class="herramienta-icono">📊</span>Ads Manager</a>
      <a class="herramienta-cm-card" href="https://www.instagram.com/" target="_blank" rel="noopener"><span class="herramienta-icono">📷</span>Instagram</a>
      <a class="herramienta-cm-card" href="https://ads.tiktok.com/" target="_blank" rel="noopener"><span class="herramienta-icono">🎵</span>TikTok Ads</a>
      <a class="herramienta-cm-card" href="https://ads.google.com/" target="_blank" rel="noopener"><span class="herramienta-icono">🔍</span>Google Ads</a>
      <a class="herramienta-cm-card" href="https://www.canva.com/" target="_blank" rel="noopener"><span class="herramienta-icono">🎨</span>Canva</a>
      <a class="herramienta-cm-card" href="https://analytics.google.com/" target="_blank" rel="noopener"><span class="herramienta-icono">📈</span>Analytics</a>
      <a class="herramienta-cm-card" href="agenda.html" style="text-decoration:none;"><span class="herramienta-icono">🗓️</span>Mi Agenda</a>
    </div>

    <div class="card">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button onclick="cambiarMesCM(-1)" aria-label="Mes anterior">←</button>
          <div class="cal-title" id="cal-title-cm">—</div>
          <button onclick="cambiarMesCM(1)" aria-label="Mes siguiente">→</button>
          <button class="btn-ghost" style="margin-left:8px;" onclick="irHoyCM()">Hoy</button>
        </div>
        <div class="cal-legend" id="cal-legend-cm"></div>
      </div>

      <div class="cal-weekdays">
        <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
      </div>

      <div class="cal-grid" id="cal-grid-cm"></div>
    </div>
  </main>

</div>

<!-- Modal: campañas activas el día seleccionado -->
<div class="modal-overlay" id="modal-dia-overlay">
  <div class="modal modal-wide">
    <div class="modal-title-row">
      <h2 id="modal-dia-titulo">—</h2>
      <button class="icon-btn" onclick="cerrarModalDiaCM()" aria-label="Cerrar">✕</button>
    </div>
    <p class="modal-sub">Campañas activas este día.</p>

    <div id="lista-campanas-dia"></div>

    <div class="modal-actions">
      <a class="btn-accent" style="flex:none; width:100%; text-align:center; text-decoration:none;" href="campanas.html">+ Añadir / editar campañas</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/calendario-cm.js"></script>
</body>
</html>
