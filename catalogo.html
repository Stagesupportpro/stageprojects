<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Catálogo</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Comercial</div>
        <h1>Catálogo</h1>
      </div>
    </div>
    <p style="color:var(--color-text-muted); font-size:14px; margin:-18px 0 24px;">
      Pensado para mostrar a clientes: sin caché, comisiones ni datos internos. Toca una ficha para ver el detalle.
    </p>

    <div class="catalogo-grid" id="catalogo-grid"></div>
  </main>

</div>

<!-- Modal de detalle -->
<div class="cat-modal-overlay" id="cat-modal-overlay" onclick="if(event.target===this) cerrarModalCatalogo()">
  <div class="cat-modal">
    <button class="cat-modal-close" onclick="cerrarModalCatalogo()">✕</button>
    <img class="cat-modal-imagen" id="cat-modal-imagen" style="display:none;" />
    <div class="cat-modal-body">
      <h2 id="cat-modal-nombre">—</h2>
      <div class="cat-modal-oficina" id="cat-modal-oficina"></div>
      <p id="cat-modal-descripcion"></p>
      <div class="cat-modal-redes" id="cat-modal-redes"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
