<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Acceso</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-screen">

  <aside class="login-side">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
      <span>STAGE SUPPORT</span>
    </div>

    <div class="tagline">
      Booking, producción<br />y management de artistas,<br />todo en <em>un mismo escenario</em>.
    </div>

    <div class="foot-note">Plataforma interna · Acceso restringido al equipo</div>
  </aside>

  <main class="login-main">
    <div class="login-card">

      <div class="brand-mark-mobile">
        <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
        <span>STAGE SUPPORT</span>
      </div>

      <h1>Acceso empleados</h1>
      <p class="sub">Entra con tu cuenta @stagesupport.com</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email">Email corporativo</label>
          <input type="email" id="email" placeholder="nombre@stagesupport.com" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="accent-dot"></span>
          <span id="submit-label">Entrar</span>
        </button>

        <div class="form-msg" id="form-msg"></div>
      </form>

    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("login-form");
  const msg = document.getElementById("form-msg");
  const submitBtn = document.getElementById("submit-btn");
  const submitLabel = document.getElementById("submit-label");

  function mostrarMensaje(texto, tipo) {
    msg.textContent = texto;
    msg.className = "form-msg show " + tipo;
  }

  // Mensaje si venimos redirigidos por falta de acceso
  const params = new URLSearchParams(window.location.search);
  if (params.get("error") === "sin-acceso") {
    mostrarMensaje("Tu cuenta no tiene acceso activo. Contacta con un administrador.", "error");
  }

  // Si ya hay sesión válida, saltar directo al dashboard
  auth.onAuthStateChanged((user) => {
    if (user && esDominioValido(user.email)) {
      window.location.href = "dashboard.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!esDominioValido(email)) {
      mostrarMensaje("Usa tu cuenta corporativa @" + DOMINIO_PERMITIDO, "error");
      return;
    }

    submitBtn.disabled = true;
    submitLabel.textContent = "Entrando…";

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const perfil = await obtenerPerfilUsuario(cred.user.uid);

      if (!perfil || perfil.activo === false) {
        await auth.signOut();
        mostrarMensaje("Tu cuenta no tiene acceso activo. Contacta con un administrador.", "error");
        submitBtn.disabled = false;
        submitLabel.textContent = "Entrar";
        return;
      }

      window.location.href = "dashboard.html";
    } catch (err) {
      submitBtn.disabled = false;
      submitLabel.textContent = "Entrar";
      const mensajes = {
        "auth/invalid-email": "El email no es válido.",
        "auth/user-not-found": "No existe ninguna cuenta con ese email.",
        "auth/wrong-password": "Contraseña incorrecta.",
        "auth/invalid-credential": "Email o contraseña incorrectos.",
        "auth/too-many-requests": "Demasiados intentos. Prueba de nuevo en unos minutos.",
      };
      mostrarMensaje(mensajes[err.code] || "No se pudo iniciar sesión. Inténtalo de nuevo.", "error");
    }
  });
</script>

</body>
</html>
