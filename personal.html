<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Personal</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Producción</div>
        <h1>Personal</h1>
      </div>
    </div>
    <p style="color:var(--color-text-muted); font-size:14px; margin:-18px 0 20px;">
      Bolsa de contactos externos — técnicos, project managers, tour managers, etc. No tienen cuenta de acceso a la plataforma.
    </p>

    <div class="table-toolbar">
      <div style="color:var(--color-text-muted); font-size:14px;" id="contador-personal">Cargando…</div>
      <button class="btn-accent" onclick="abrirModalPersonal()">+ Nuevo contacto</button>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>Contacto</th>
          <th>Teléfono</th>
          <th>Rol</th>
          <th>Tarifa</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-personal"></tbody>
    </table>
  </main>

</div>

<!-- Modal alta / edición de contacto -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-titulo">Nuevo contacto</h2>
    <p class="modal-sub">Persona externa disponible para asignar a producciones y bookings.</p>

    <form id="form-personal">
      <input type="hidden" id="personal-id-edicion" />

      <div class="field">
        <label for="p-nombre">Nombre</label>
        <input type="text" id="p-nombre" placeholder="Ej. Marta" required />
      </div>

      <div class="field">
        <label for="p-apellidos">Apellidos</label>
        <input type="text" id="p-apellidos" placeholder="Ej. Serra Puig" />
      </div>

      <div class="field">
        <label for="p-telefono">Teléfono</label>
        <input type="tel" id="p-telefono" placeholder="Ej. 600 123 456" />
      </div>

      <div class="field">
        <label for="p-email">Email</label>
        <input type="email" id="p-email" placeholder="marta@ejemplo.com" />
      </div>

      <div class="field">
        <label for="p-rol">Rol</label>
        <select id="p-rol"></select>
      </div>

      <div class="field">
        <label for="p-tarifa">Tarifa (€)</label>
        <input type="number" id="p-tarifa" placeholder="Ej. 250" min="0" step="0.01" />
      </div>

      <div class="field">
        <label for="p-situacion">Situación</label>
        <select id="p-situacion" onchange="alCambiarSituacion()">
          <option value="ss">Alta en la Seguridad Social</option>
          <option value="autonomo">Autónomo</option>
        </select>
      </div>

      <div id="campos-autonomo" style="display:none;">
        <div class="form-grid">
          <div class="field">
            <label for="p-retencion">Retención IRPF (%)</label>
            <input type="number" id="p-retencion" placeholder="Ej. 15" min="0" max="100" step="0.1" />
          </div>
          <div class="field">
            <label for="p-iva">IVA (%)</label>
            <input type="number" id="p-iva" placeholder="Ej. 21" min="0" max="100" step="0.1" />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="p-notas">Notas (opcional)</label>
        <input type="text" id="p-notas" placeholder="Disponibilidad, especialidad…" />
      </div>

      <div class="form-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-accent" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/personal.js"></script>
</body>
</html>
