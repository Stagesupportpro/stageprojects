<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Ver Roster</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Booking &amp; Management · <a href="roster.html" style="color:inherit;">Roster</a></div>
        <h1 id="rv-titulo-cabecera">Espectáculo</h1>
      </div>
      <a class="btn-accent" style="text-decoration:none;" id="rv-link-editar" href="#">Editar</a>
    </div>

    <div class="card">
      <div class="rst-tabs" id="rv-tabs">
        <button type="button" data-tab="general" onclick="cambiarTabVer('general')">Información general</button>
        <button type="button" data-tab="tarifas" onclick="cambiarTabVer('tarifas')">Tarifas</button>
        <button type="button" data-tab="riders" onclick="cambiarTabVer('riders')">Riders</button>
        <button type="button" data-tab="hospitalidad" onclick="cambiarTabVer('hospitalidad')">Hospitalidad</button>
        <button type="button" data-tab="presskit" onclick="cambiarTabVer('presskit')">PressKit</button>
        <button type="button" data-tab="juridico" class="juridico" id="rv-btn-tab-juridico" style="display:none;" onclick="cambiarTabVer('juridico')">Jurídico</button>
      </div>

      <div class="rst-tab-panel active" id="rv-panel-general">
        <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:18px;">
          <div class="poster-preview" id="rv-poster" style="width:140px; height:140px; flex-shrink:0;">Sin imagen</div>
          <div style="flex:1; min-width:240px;">
            <div class="ver-field-row"><div class="ver-label">Categoría</div><div id="rv-categoria">—</div></div>
            <div class="ver-field-row"><div class="ver-label">Etiquetas</div><div id="rv-etiquetas">—</div></div>
            <div class="ver-field-row"><div class="ver-label">Oficina</div><div id="rv-oficina">—</div></div>
            <div class="ver-field-row"><div class="ver-label">Descripción</div><div id="rv-descripcion">—</div></div>
            <div id="rv-campos-extra"></div>
            <div class="ver-field-row"><div class="ver-label">Notas</div><div id="rv-notas">—</div></div>
          </div>
        </div>
        <h3 style="font-size:14px; margin-bottom:8px;">Contactos</h3>
        <div id="rv-contactos" style="margin-bottom:18px;"></div>
        <h3 style="font-size:14px; margin-bottom:8px;">Redes sociales</h3>
        <div id="rv-redes"></div>
      </div>

      <div class="rst-tab-panel" id="rv-panel-tarifas">
        <div class="calc-box" style="margin-bottom:18px;">
          <div class="calc-item"><div class="calc-label">Coste</div><div class="calc-value" id="rv-calc-cache">0,00 €</div></div>
          <div class="calc-item"><div class="calc-label">Comisión</div><div class="calc-value" id="rv-calc-comision">0,00 €</div></div>
          <div class="calc-item"><div class="calc-label">PVP</div><div class="calc-value" id="rv-calc-total">0,00 €</div></div>
          <div class="calc-item calc-total"><div class="calc-label">PVP + IVA</div><div class="calc-value" id="rv-calc-total-iva">0,00 €</div></div>
        </div>
        <h3 style="font-size:14px; margin-bottom:8px;">Otras tarifas</h3>
        <div id="rv-tarifas"></div>
      </div>

      <div class="rst-tab-panel" id="rv-panel-riders">
        <div id="rv-riders"></div>
      </div>

      <div class="rst-tab-panel" id="rv-panel-hospitalidad">
        <div class="ver-field-row"><div class="ver-label">Condiciones</div><div id="rv-hosp-condiciones">—</div></div>
        <div id="rv-hosp-pdfs" style="margin-top:12px;"></div>
      </div>

      <div class="rst-tab-panel" id="rv-panel-presskit">
        <div id="rv-presskit"></div>
      </div>

      <div class="rst-tab-panel" id="rv-panel-juridico">
        <div id="rv-juridico"></div>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/roster-ver.js"></script>
</body>
</html>
