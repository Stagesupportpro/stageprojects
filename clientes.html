<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Clientes</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Booking &amp; Comercial</div>
        <h1>Clientes</h1>
      </div>
    </div>

    <div class="table-toolbar">
      <div style="color:var(--color-text-muted); font-size:14px;" id="contador-clientes">Cargando…</div>
      <button class="btn-accent" onclick="abrirModalCliente()">+ Nuevo cliente</button>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Categoría</th>
          <th>Teléfono</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-clientes"></tbody>
    </table>
  </main>

</div>

<!-- Modal alta / edición -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-titulo">Nuevo cliente</h2>
    <p class="modal-sub">Empresa, entidad o particular con la que trabajáis.</p>

    <form id="form-cliente">
      <input type="hidden" id="cli-id-edicion" />

      <div class="field">
        <label for="cli-nombre">Nombre / razón social</label>
        <input type="text" id="cli-nombre" placeholder="Ej. Ayuntamiento de Sant Joanet" required />
      </div>

      <div class="field">
        <label for="cli-categoria">Categoría</label>
        <select id="cli-categoria">
          <option value="privado">Privado</option>
          <option value="admin_publica">Administración Pública</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <div class="field">
        <label for="cli-cif">CIF / NIF</label>
        <input type="text" id="cli-cif" />
      </div>

      <div class="field">
        <label for="cli-contacto">Persona de contacto</label>
        <input type="text" id="cli-contacto" />
      </div>

      <div class="field">
        <label for="cli-telefono">Teléfono</label>
        <input type="tel" id="cli-telefono" />
      </div>

      <div class="field">
        <label for="cli-email">Email</label>
        <input type="email" id="cli-email" />
      </div>

      <div class="field">
        <label for="cli-direccion">Dirección</label>
        <input type="text" id="cli-direccion" />
      </div>

      <div class="field">
        <label for="cli-notas">Notas (opcional)</label>
        <input type="text" id="cli-notas" />
      </div>

      <div class="form-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-accent" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
