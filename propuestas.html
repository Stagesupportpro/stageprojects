<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Propuestas</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Booking &amp; Comercial</div>
        <h1>Propuestas</h1>
      </div>
    </div>

    <div class="table-toolbar">
      <div style="color:var(--color-text-muted); font-size:14px;" id="contador-propuestas">Cargando…</div>
      <button class="btn-accent" onclick="abrirModalPropuesta()">+ Nueva propuesta</button>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Cliente</th>
          <th>Estado</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-propuestas"></tbody>
    </table>
  </main>

</div>

<!-- Modal alta rápida -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Nueva propuesta</h2>
    <p class="modal-sub">Se le asignará automáticamente un ID correlativo (PROV&lt;año&gt;-0001).</p>

    <form id="form-propuesta">
      <div class="field">
        <label for="prop-nombre">Nombre</label>
        <input type="text" id="prop-nombre" placeholder="Ej. Propuesta Fiestas Mayores 2026" required />
      </div>

      <div class="field">
        <label for="prop-cliente">Cliente (opcional)</label>
        <select id="prop-cliente"><option value="">— Sin vincular —</option></select>
      </div>

      <div class="form-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-accent" id="btn-guardar">Crear propuesta</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/ids.js"></script>
<script src="js/propuestas.js"></script>
</body>
</html>
