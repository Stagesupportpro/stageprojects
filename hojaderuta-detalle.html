<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Hoja de Ruta</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar no-print" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main no-print">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Producción · <a href="hojasderuta.html" style="color:inherit;">Hojas de Ruta</a></div>
        <h1 id="hr-titulo-cabecera">Hoja de ruta</h1>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;">
        <div>
          <div style="font-size:12px; color:var(--color-text-muted); font-weight:600; margin-bottom:6px;">ID</div>
          <span class="id-badge" id="hr-id-badge">—</span>
        </div>
        <div class="doc-actions-bar">
          <button class="btn-ghost" onclick="imprimirHR()">🖨️ Imprimir</button>
          <button class="btn-ghost" onclick="descargarPdfHR()" id="btn-pdf">⬇️ Descargar PDF</button>
          <button class="btn-accent" onclick="guardarHR()" id="btn-guardar-hr">Guardar cambios</button>
        </div>
      </div>
    </div>

    <div class="card">
      <form id="form-hr-detalle" onsubmit="return false;">

        <!-- Nombre / Producción -->
        <div class="hr-section">
          <div class="form-grid">
            <div class="field field-wide">
              <label for="d-nombre">Nombre de la hoja de ruta</label>
              <input type="text" id="d-nombre" placeholder="Ej. Back to Glory Days - Sala Apolo" />
            </div>
          </div>
        </div>

        <!-- Datos de la actuación -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Datos de la actuación</h3></div>
          <div class="form-grid">
            <div class="field"><label for="da-artista">Artista / Grupo</label>
              <select id="da-artista" onchange="alSeleccionarArtista()">
                <option value="">— Selecciona del Roster —</option>
              </select>
            </div>
            <div class="field"><label for="da-fecha">Fecha</label><input type="date" id="da-fecha" /></div>
            <div class="field"><label for="da-ciudad">Ciudad</label><input type="text" id="da-ciudad" placeholder="Ej. Vilajoyosa, Alc" /></div>
            <div class="field"><label for="da-local">Local / Recinto / Festival</label><input type="text" id="da-local" /></div>
            <div class="field field-wide"><label for="da-direccion">Dirección</label><input type="text" id="da-direccion" /></div>
            <div class="field"><label for="da-maps">Enlace mapa (opcional)</label><input type="url" id="da-maps" placeholder="https://maps.app.goo.gl/…" /></div>
            <div class="field">
              <label for="da-parking">Parking en el recinto</label>
              <select id="da-parking"><option value="">—</option><option value="Sí">Sí</option><option value="No">No</option></select>
            </div>
          </div>
        </div>

        <!-- Contactos -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Contactos</h3></div>
          <div id="lista-contactos"></div>
          <button type="button" class="add-row-link" onclick="anadirContacto()">+ Añadir contacto</button>
          <datalist id="tipos-contacto">
            <option value="Tourmanager"></option>
            <option value="Responsable"></option>
            <option value="Técnico de Sonido"></option>
            <option value="Producción"></option>
            <option value="Promotor"></option>
            <option value="Seguridad"></option>
            <option value="Catering"></option>
            <option value="Otro"></option>
          </datalist>
        </div>

        <!-- Planning -->
        <div class="hr-section">
          <div class="hr-section-head">
            <h3>Planning</h3>
            <button type="button" class="btn-ghost" onclick="anadirDiaPlanning()">+ Añadir día</button>
          </div>
          <div id="lista-plannings"></div>
        </div>

        <!-- Alojamiento -->
        <div class="hr-section">
          <div class="hr-section-head">
            <h3>Alojamiento</h3>
            <label class="hr-toggle"><input type="checkbox" id="aloj-activo" onchange="toggleBloque('aloj')" /> Incluir</label>
          </div>
          <div class="form-grid" id="bloque-aloj" style="display:none;">
            <div class="field field-wide"><label for="aloj-nombre">Nombre del alojamiento</label><input type="text" id="aloj-nombre" /></div>
            <div class="field"><label for="aloj-checkin">Check-in</label><input type="text" id="aloj-checkin" placeholder="Ej. 16:00" /></div>
            <div class="field"><label for="aloj-checkout">Check-out</label><input type="text" id="aloj-checkout" placeholder="Ej. 12:00" /></div>
            <div class="field field-wide"><label for="aloj-direccion">Dirección</label><input type="text" id="aloj-direccion" /></div>
            <div class="field"><label for="aloj-telefono">Teléfono</label><input type="tel" id="aloj-telefono" /></div>
            <div class="field"><label for="aloj-maps">Enlace mapa</label><input type="url" id="aloj-maps" /></div>
            <div class="field"><label for="aloj-parking">Parking</label>
              <select id="aloj-parking"><option value="">—</option><option value="Sí">Sí</option><option value="No">No</option></select>
            </div>
            <div class="field field-wide"><label for="aloj-notas">Notas</label><input type="text" id="aloj-notas" /></div>
          </div>
        </div>

        <!-- Dietas -->
        <div class="hr-section">
          <div class="hr-section-head">
            <h3>Dietas</h3>
            <label class="hr-toggle"><input type="checkbox" id="dietas-activo" onchange="toggleBloque('dietas')" /> Incluir</label>
          </div>
          <div class="form-grid" id="bloque-dietas" style="display:none;">
            <div class="field field-wide"><label for="dietas-nombre">Restaurante / Catering</label><input type="text" id="dietas-nombre" /></div>
            <div class="field"><label for="dietas-horario">Horario</label><input type="text" id="dietas-horario" placeholder="Ej. 20:30" /></div>
            <div class="field"><label for="dietas-telefono">Teléfono</label><input type="tel" id="dietas-telefono" /></div>
            <div class="field field-wide"><label for="dietas-direccion">Dirección</label><input type="text" id="dietas-direccion" /></div>
            <div class="field"><label for="dietas-maps">Enlace mapa</label><input type="url" id="dietas-maps" /></div>
            <div class="field field-wide"><label for="dietas-notas">Notas</label><input type="text" id="dietas-notas" /></div>
          </div>
        </div>

        <!-- Logo del evento -->
        <div class="hr-section">
          <div class="hr-section-head"><h3>Logo del evento (opcional)</h3></div>
          <div class="logo-picker">
            <div class="logo-preview" id="evento-logo-preview" style="width:64px; height:64px; border-radius:50%;">Sin logo</div>
            <div class="logo-actions">
              <button type="button" class="btn-ghost" onclick="document.getElementById('evento-logo-input').click()">Subir logo</button>
              <button type="button" class="btn-ghost" id="btn-quitar-logo-evento" style="display:none;" onclick="quitarLogoEvento()">Quitar</button>
              <input type="file" id="evento-logo-input" accept="image/*" onchange="procesarLogoEvento(event)" />
            </div>
          </div>
        </div>

        <!-- Previsión meteorológica -->
        <div class="hr-section">
          <div class="hr-section-head">
            <h3>Previsión meteorológica</h3>
            <button type="button" class="btn-ghost" onclick="consultarPrevisionTiempo()">Consultar previsión</button>
          </div>
          <div class="weather-box" id="weather-box">Todavía no se ha consultado. Rellena Ciudad y Fecha y pulsa "Consultar previsión".</div>
        </div>

        <!-- Observaciones -->
        <div class="hr-section">
          <div class="field">
            <label for="d-observaciones">Observaciones</label>
            <input type="text" id="d-observaciones" placeholder="Cualquier detalle adicional…" />
          </div>
        </div>

      </form>
    </div>
  </main>

</div>

<!-- Área oculta usada para generar la versión imprimible / PDF -->
<div id="print-area"></div>

<div class="toast no-print" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/hojaderuta-detalle.js"></script>
</body>
</html>
