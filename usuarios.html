<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Usuarios</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <div class="pass-version" id="pass-version"></div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Administración</div>
        <h1>Usuarios</h1>
      </div>
    </div>

    <div class="table-toolbar">
      <div style="color:var(--color-text-muted); font-size:14px;" id="contador-usuarios">Cargando…</div>
      <button class="btn-accent" onclick="abrirModal()">+ Nuevo usuario</button>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Teléfono</th>
          <th>Rol</th>
          <th>Estado</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
        <!-- filas generadas por usuarios.js -->
      </tbody>
    </table>
  </main>

</div>

<!-- Modal alta / edición -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-titulo">Nuevo usuario</h2>
    <p class="modal-sub" id="modal-sub">Se creará una cuenta con acceso inmediato a la plataforma.</p>

    <form id="form-usuario">
      <input type="hidden" id="uid-edicion" />
      <input type="hidden" id="foto-data" />

      <div class="photo-picker">
        <div class="photo-preview" id="photo-preview">?</div>
        <div class="photo-actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('foto-input').click()">Subir foto</button>
          <button type="button" class="btn-ghost" id="btn-quitar-foto" style="display:none;" onclick="quitarFoto()">Quitar foto</button>
          <input type="file" id="foto-input" accept="image/*" onchange="procesarFoto(event)" />
        </div>
      </div>

      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ej. Laura" required />
      </div>

      <div class="field">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" placeholder="Ej. Gómez Ruiz" />
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej. 600 123 456" />
      </div>

      <div class="field" id="campo-email">
        <label for="email">Email corporativo</label>
        <input type="email" id="email" placeholder="nombre@stagesupport.com" required />
      </div>

      <div class="field" id="campo-password">
        <label for="password">Contraseña provisional</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" />
      </div>

      <div class="field">
        <label for="rol">Rol</label>
        <select id="rol" required></select>
      </div>

      <div class="field" id="campo-activo" style="display:none;">
        <label for="activo">Estado de la cuenta</label>
        <select id="activo">
          <option value="true">Activo</option>
          <option value="false">Suspendido</option>
        </select>
      </div>

      <div class="form-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-accent" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
