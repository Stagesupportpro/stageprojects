<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stage Support · Bookings</title>
<link rel="icon" href="assets/logo_stagesupport.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-mark">
      <img src="assets/logo_stagesupport.png" alt="Stage Support" onerror="this.style.display='none'" />
    </div>

    <nav id="nav-container" style="flex:1; overflow-y:auto;"></nav>

    <div class="sidebar-footer">
      <div class="access-pass">
        <div class="pass-top">
          <div class="pass-avatar" id="pass-avatar">—</div>
          <div>
            <div class="pass-name" id="pass-name">—</div>
            <div class="pass-role" id="pass-role">—</div>
          </div>
        </div>
        <button class="pass-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="eyebrow">Booking &amp; Management</div>
        <h1>Bookings</h1>
      </div>
    </div>

    <div class="table-toolbar">
      <div style="color:var(--color-text-muted); font-size:14px;" id="contador-bookings">Cargando…</div>
      <button class="btn-accent" onclick="abrirModalBooking()">+ Nuevo booking</button>
    </div>

    <table class="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Artista</th>
          <th>Tipo</th>
          <th>Cliente / Espacio</th>
          <th>Fecha</th>
          <th>Total + IVA</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-bookings"></tbody>
    </table>
  </main>

</div>

<!-- Modal alta / edición de booking -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal modal-wide">
    <h2 id="modal-titulo">Nuevo booking</h2>
    <p class="modal-sub" id="modal-sub">Se le asignará automáticamente un ID correlativo (BO&lt;año&gt;-0001).</p>

    <form id="form-booking">
      <input type="hidden" id="bk-id-edicion" />

      <div class="field" id="campo-id-existente" style="display:none;">
        <label>ID</label>
        <div><span class="id-badge" id="bk-id-badge">—</span></div>
      </div>

      <!-- Tipo de booking -->
      <div class="field">
        <label>Tipo de booking</label>
        <div class="tipo-toggle">
          <label><input type="radio" name="bk-tipo" value="cache" checked onchange="alCambiarTipoBooking()" /><span>Fecha contratada (a caché)<span class="tipo-sub">Actuamos como agencia de booking</span></span></label>
          <label><input type="radio" name="bk-tipo" value="promotor" onchange="alCambiarTipoBooking()" /><span>Como promotora<span class="tipo-sub">Organizamos nosotros el espectáculo</span></span></label>
        </div>
      </div>

      <div class="field">
        <label for="bk-artista">Artista (Roster)</label>
        <select id="bk-artista" onchange="alSeleccionarArtistaBooking()" required></select>
      </div>

      <!-- Bloque: a caché -->
      <div id="bloque-cache">
        <div class="field">
          <label>Origen</label>
          <div class="origen-toggle">
            <label><input type="radio" name="bk-origen" value="cliente" checked onchange="alCambiarOrigenCache()" />Cliente directo</label>
            <label><input type="radio" name="bk-origen" value="propuesta" onchange="alCambiarOrigenCache()" />Desde propuesta</label>
          </div>
        </div>
        <div class="field" id="campo-bk-cliente">
          <label for="bk-cliente">Cliente</label>
          <select id="bk-cliente"><option value="">— Selecciona un cliente —</option></select>
        </div>
        <div class="field" id="campo-bk-propuesta" style="display:none;">
          <label for="bk-propuesta">Propuesta</label>
          <select id="bk-propuesta" onchange="alSeleccionarPropuestaBooking()"><option value="">— Selecciona una propuesta —</option></select>
        </div>
      </div>

      <!-- Bloque: promotor -->
      <div id="bloque-promotor" style="display:none;">
        <div class="field">
          <label for="bk-espacio">Espacio / Recinto</label>
          <input type="text" id="bk-espacio" placeholder="Ej. Sala Apolo" />
        </div>
        <div class="field">
          <label for="bk-espacio-direccion">Dirección (opcional)</label>
          <input type="text" id="bk-espacio-direccion" />
        </div>
      </div>

      <div class="form-grid">
        <div class="field"><label for="bk-fecha">Fecha</label><input type="date" id="bk-fecha" required /></div>
        <div class="field"><label for="bk-ciudad">Ciudad</label><input type="text" id="bk-ciudad" /></div>
      </div>

      <!-- Calculadora -->
      <div class="hr-section" style="border:none; padding-bottom:0;">
        <div class="hr-section-head"><h3 style="font-size:14px;">Caché, comisión e IVA</h3></div>
        <div class="form-grid">
          <div class="field"><label for="bk-cache">Caché (BI) €</label><input type="number" id="bk-cache" min="0" step="0.01" oninput="recalcularBooking()" /></div>
          <div class="field">
            <label for="bk-comision-preset">Comisión guardada</label>
            <select id="bk-comision-preset" onchange="aplicarComisionPresetBooking()">
              <option value="">— Manual —</option>
            </select>
          </div>
          <div class="field"><label for="bk-comision-pct">Comisión (%)</label><input type="number" id="bk-comision-pct" min="0" max="100" step="0.1" oninput="recalcularBooking()" /></div>
          <div class="field"><label for="bk-iva-pct">IVA (%)</label><input type="number" id="bk-iva-pct" min="0" max="100" step="0.1" value="21" oninput="recalcularBooking()" /></div>
        </div>
        <div class="calc-box" style="margin-top:12px;">
          <div class="calc-item"><div class="calc-label">Caché (BI)</div><div class="calc-value" id="bk-calc-cache">0,00 €</div></div>
          <div class="calc-item"><div class="calc-label">Comisión</div><div class="calc-value" id="bk-calc-comision">0,00 €</div></div>
          <div class="calc-item"><div class="calc-label">Total</div><div class="calc-value" id="bk-calc-total">0,00 €</div></div>
          <div class="calc-item calc-total"><div class="calc-label">Total + IVA</div><div class="calc-value" id="bk-calc-total-iva">0,00 €</div></div>
        </div>
      </div>

      <div class="field" style="margin-top:16px;">
        <label for="bk-notas">Notas (opcional)</label>
        <input type="text" id="bk-notas" />
      </div>

      <div class="form-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-accent" id="btn-guardar">Crear booking</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/ids.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
